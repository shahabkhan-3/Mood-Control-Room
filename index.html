<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modd Changer Room</title>
    <link rel="stylesheet" href="miniProject1.css">
</head>
<body>
    <h1>Mood Control Room </h1>
    <input type="password" class="pass" placeholder="Enter password">
    <button class="btn">Login</button>
    <p class="msg"></p>
    <div class="control-panel" style="display: none;">
        <div class="bulb"></div>
        <button class="btn2">on/off</button>
        <div class="mood-counter">
            <h4 class="count">0 mood changes</h4>
            <button class="happy">happy</button>
            <button class="sad">sad</button>
            <button class="angry">angry</button>
            <p class="emoji">...</p>
        </div>
        <div class="traffic-mood">
            <div class="lightred"></div>
            <div class="lightyellow"></div>
            <div class="lightgreen"></div>
            <button class="trafficbtn">next</button>
        </div>

    </div>
    <script src="miniProjoect1.js"></script>
</body>
</html>
